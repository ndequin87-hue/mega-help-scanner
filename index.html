<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGA HELP — Scanner</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #071a33;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      margin-top: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 18px;
      border-radius: 12px;
      background: white;
      color: #111;
      font-size: 18px;
      word-break: break-word;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>MEGA HELP</h1>
  <p>Scanner des billets 100 ÉGAL 2026</p>

  <div id="reader"></div>

  <div id="result">
    En attente d'un code-barres...
  </div>

  <button onclick="startScanner()">Démarrer le scanner</button>
  <button onclick="stopScanner()">Arrêter</button>

<script>

let codeReader = null;
let scanning = false;

function startScanner() {

  if (scanning) return;

  codeReader = new ZXing.BrowserMultiFormatReader();
  scanning = true;

  document.getElementById("result").innerHTML =
    "📷 Recherche du code-barres...";

  codeReader.decodeFromVideoDevice(
    null,
    "reader",
    (result, error) => {

      if (result) {

        const code = result.getText().trim();

        document.getElementById("result").innerHTML =
          "<div class='success'>✅ CODE SCANNÉ</div>" +
          "<br>" +
          "<strong>" + escapeHtml(code) + "</strong>";

        console.log("Code détecté :", code);

        // Arrête automatiquement après une lecture
        stopScanner();
      }
    }
  ).catch(error => {

    console.error(error);

    document.getElementById("result").innerHTML =
      "<div class='error'>❌ Impossible d'ouvrir la caméra.</div>" +
      "<br>Vérifie l'autorisation de la caméra.";
    
    scanning = false;
  });
}

function stopScanner() {

  if (codeReader) {
    try {
      codeReader.reset();
    } catch(e) {}
  }

  scanning = false;
}

function escapeHtml(text) {

  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

</script>

</body>
</html>
