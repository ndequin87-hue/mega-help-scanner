<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGA HELP 100 ÉGAL 2026</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f3f6;
  margin: 0;
  padding: 16px;
}

.card {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

h1 {
  text-align: center;
  font-size: 23px;
  margin: 5px 0 8px;
}

.subtitle {
  text-align: center;
  color: #666;
  font-size: 20px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 16px;
  font-size: 18px;
  border: 2px solid #ccc;
  border-radius: 10px;
  margin-bottom: 10px;
}

button {
  width: 100%;
  box-sizing: border-box;
  padding: 17px;
  margin-top: 10px;
  font-size: 18px;
  font-weight: bold;
  border: 0;
  border-radius: 10px;
  background: #222;
  color: white;
  cursor: pointer;
}

#lecteur {
  width: 100%;
  margin-top: 15px;
  display: none;
}

#detecte {
  display: none;
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  background: #eef2f7;
  text-align: center;
  word-break: break-all;
  font-size: 17px;
}

#resultat {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin-top: 22px;
  min-height: 60px;
}

.vert { color: green; }
.rouge { color: red; }
.orange { color: #d28b00; }

.small {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="card">

<h1>MEGA HELP 100 ÉGAL 2026</h1>
<div class="subtitle">Contrôle des entrées</div>

<input id="poste" type="text" placeholder="Poste : Entrée 1">

<input id="code" type="text" autocomplete="off"
       placeholder="Code du ticket">

<button id="btnScan" onclick="ouvrirCamera()">
📷 SCANNER AVEC LA CAMÉRA
</button>

<div id="lecteur"></div>

<div id="detecte">
  <strong>Code détecté :</strong>
  <div id="codeDetecte"></div>
</div>

<button onclick="controlerCode()">
✅ CONTRÔLER LE CODE
</button>

<div id="resultat"></div>

<div class="small">
Un code ne peut être utilisé qu'une seule fois.
</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxH4h_EQh7_d8T-IDgR8GKk1ryyGE5yh7PNlpAYTTqO1_6clqtPSjB2sroC6ks4p2W5/exec";

let lecteur = null;
let cameraActive = false;
let traitementEnCours = false;

function afficher(message, classe) {
  const resultat = document.getElementById("resultat");
  resultat.textContent = message;
  resultat.className = classe || "";
}

function ouvrirCamera() {

  if (cameraActive) return;

  const zone = document.getElementById("lecteur");

  zone.style.display = "block";

  document.getElementById("detecte").style.display = "none";

  afficher("📷 Ouverture de la caméra...", "orange");

  lecteur = new Html5Qrcode("lecteur");

  lecteur.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: { width: 320, height: 140 },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128
      ]
    },

    function(codeLu) {

      if (traitementEnCours) return;

      // Affiche exactement ce que la caméra a lu.
      document.getElementById("codeDetecte").textContent = codeLu;
      document.getElementById("detecte").style.display = "block";

      // Place le code lu dans le champ.
      document.getElementById("code").value = codeLu;

      // Arrête la caméra avant le contrôle.
      fermerCamera();

      // Petite pause pour laisser le temps de voir le code détecté.
      setTimeout(function() {
        controlerCode();
      }, 500);
    },

    function(errorMessage) {
      // Les erreurs de lecture intermédiaires sont normales.
    }

  ).then(function() {

    cameraActive = true;

    afficher("📷 Visez le code-barres", "orange");

  }).catch(function(erreur) {

    cameraActive = false;

    zone.style.display = "none";

    afficher(
      "⚠️ Impossible d'ouvrir la caméra",
      "rouge"
    );

    console.log(erreur);
  });
}

function fermerCamera() {

  if (!lecteur || !cameraActive) return;

  lecteur.stop().then(function() {

    lecteur.clear();

    cameraActive = false;

    document.getElementById("lecteur").style.display = "none";

  }).catch(function(erreur) {

    cameraActive = false;

    document.getElementById("lecteur").style.display = "none";

    console.log(erreur);
  });
}

function controlerCode() {

  if (traitementEnCours) return;

  const code = document.getElementById("code").value.trim();

  const poste =
    document.getElementById("poste").value.trim()
    || "Poste inconnu";

  if (!code) {

    afficher("⚠️ SCANNEZ UN CODE", "orange");

    return;
  }

  traitementEnCours = true;

  afficher("⏳ Vérification...", "orange");

  const callbackName =
    "megaHelpCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);

  const script = document.createElement("script");

  window[callbackName] = function(reponse) {

    try {

      if (reponse.statut === "VALIDE") {

        afficher(
          "🟢 ENTRÉE AUTORISÉE",
          "vert"
        );

      } else if (reponse.statut === "UTILISE") {

        afficher(
          "🔴 DÉJÀ UTILISÉ",
          "rouge"
        );

      } else if (reponse.statut === "INCONNU") {

        afficher(
          "🔴 CODE INCONNU",
          "rouge"
        );

      } else {

        afficher(
          reponse.message || "⚠️ ERREUR",
          "orange"
        );
      }

    } finally {

      traitementEnCours = false;

      script.remove();

      delete window[callbackName];

      document.getElementById("code").focus();
    }
  };

  script.onerror = function() {

    afficher(
      "⚠️ ERREUR DE CONNEXION AU SERVEUR",
      "rouge"
    );

    traitementEnCours = false;

    script.remove();

    delete window[callbackName];
  };

  script.src =
    API_URL
    + "?api=1"
    + "&code=" + encodeURIComponent(code)
    + "&poste=" + encodeURIComponent(poste)
    + "&callback=" + encodeURIComponent(callbackName)
    + "&t=" + Date.now();

  document.body.appendChild(script);
}

document.getElementById("code").addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") {
      controlerCode();
    }
  }
);

</script>

</body>
</html>
